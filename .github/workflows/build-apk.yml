
name: AHZA ASISTANT APK + EXE Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  android:
    name: Build AHZA Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Source ZIP
        run: |
          mkdir -p source

          for file in ./*.zip; do
            if [ -f "$file" ]; then
              unzip -o "$file" -d source
            fi
          done

      - name: Find Flutter Project
        shell: bash
        run: |
          PROJECT=$(find . -name pubspec.yaml \
            -not -path './.git/*' \
            -not -path './.dart_tool/*' \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan!"
            exit 1
          fi

          DIR=$(dirname "$PROJECT")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan: $DIR"

      - name: Fix Dart Package Name
        run: |
          sed -i 's/^name:.*/name: ahza_lua_asistant/' "$PROJECT_DIR/pubspec.yaml"

      - name: Generate Android Platform
        run: |
          cd "$PROJECT_DIR"
          flutter create --project-name ahza_lua_asistant --platforms=android .

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Rename APK
        run: |
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" AHZA-ASISTANT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AHZA-ASISTANT-APK
          path: AHZA-ASISTANT.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Build AHZA Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Extract Source ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path source | Out-Null

          Get-ChildItem -Path . -Filter *.zip | ForEach-Object {
            Expand-Archive -Path $_.FullName -DestinationPath source -Force
          }

      - name: Find Flutter Project
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Filter pubspec.yaml -Recurse |
            Where-Object { $_.FullName -notmatch '\\.git\\|\\.dart_tool\\' } |
            Select-Object -First 1

          if (-not $project) {
            throw "ERROR: pubspec.yaml tidak ditemukan!"
          }

          $dir = $project.Directory.FullName

          "PROJECT_DIR=$dir" >> $env:GITHUB_ENV

          Write-Host "Flutter project: $dir"

      - name: Fix Dart Package Name
        shell: pwsh
        run: |
          $file = Join-Path $env:PROJECT_DIR "pubspec.yaml"

          $content = Get-Content $file -Raw
          $content = [regex]::Replace(
            $content,
            '(?m)^name:\s*.*$',
            'name: ahza_lua_asistant'
          )

          Set-Content -Path $file -Value $content -Encoding utf8

      - name: Generate Windows Platform
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR

          flutter create `
            --project-name ahza_lua_asistant `
            --platforms=windows .

      - name: Install Dependencies
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          flutter pub get

      - name: Build Windows Release
        shell: pwsh
        run: |
          Set-Location $env:PROJECT_DIR
          flutter build windows --release

      - name: Package Windows Application
        shell: pwsh
        run: |
          $release = Join-Path $env:PROJECT_DIR "build/windows/x64/runner/Release"

          if (-not (Test-Path $release)) {
            throw "Windows Release folder tidak ditemukan!"
          }

          $exe = Get-ChildItem $release -Filter *.exe |
            Select-Object -First 1

          if (-not $exe) {
            throw "EXE tidak ditemukan!"
          }

          Compress-Archive `
            -Path "$release/*" `
            -DestinationPath AHZA-ASISTANT-WINDOWS.zip `
            -Force

      - name: Upload Windows Application
        uses: actions/upload-artifact@v4
        with:
          name: AHZA-ASISTANT-WINDOWS
          path: AHZA-ASISTANT-WINDOWS.zip
          if-no-files-found: error
          retention-days: 30
